<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#0b0a1f" />
<title>YILAN</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg0:#07061a; --ink:#eef1ff; --muted:#9aa0d6;
    --cyan:#22e6ff; --magenta:#ff37c7; --gold:#ffd54a; --lime:#8bff5a;
    --panel:rgba(10,8,26,.30); --stroke:rgba(140,150,255,.16);
    --card-bg:rgba(10,8,26,.62);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:var(--bg0);
    font-family:"Space Grotesk",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink);
    touch-action:none;overscroll-behavior:none;-webkit-user-select:none;user-select:none;}
  canvas#game{display:block;position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;}

  .hud{position:fixed;z-index:5;pointer-events:none;}
  #stats{top:14px;left:14px;padding:10px 14px;border-radius:14px;background:var(--panel);
    border:1px solid var(--stroke);backdrop-filter:blur(3px);min-width:150px;text-shadow:0 1px 3px rgba(0,0,0,.55);}
  #stats .row{display:flex;align-items:baseline;gap:8px;line-height:1.15;}
  #stats .lbl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);}
  #stats .big{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;}
  #stats .len .big{color:var(--cyan);text-shadow:0 0 14px rgba(34,230,255,.5);}
  #stats .rank .big{color:var(--gold);text-shadow:0 0 14px rgba(255,213,74,.45);}
  #board{top:14px;right:14px;padding:10px 12px;border-radius:14px;background:var(--panel);
    border:1px solid var(--stroke);backdrop-filter:blur(3px);width:196px;text-shadow:0 1px 3px rgba(0,0,0,.55);}
  #board h4{margin:0 0 8px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:600;}
  #board ol{margin:0;padding:0;list-style:none;counter-reset:r;}
  #board li{display:flex;justify-content:space-between;gap:8px;font-size:13px;padding:2px 0;counter-increment:r;
    color:#cdd2ff;white-space:nowrap;}
  #board li::before{content:counter(r);width:16px;color:var(--muted);font-variant-numeric:tabular-nums;}
  #board li .nm{flex:1;overflow:hidden;text-overflow:ellipsis;}
  #board li .sc{font-variant-numeric:tabular-nums;color:#eef1ff;opacity:.75;}
  #board li.me{color:var(--cyan);font-weight:600;}
  #board li.me .sc{color:var(--cyan);}
  .hud.hidden{display:none;}

  #gameui{position:fixed;left:14px;bottom:14px;z-index:6;pointer-events:auto;display:flex;gap:8px;}
  #gameui.hidden{display:none;}
  .miniBtn{padding:9px 12px;border-radius:12px;border:1px solid var(--stroke);
    background:var(--panel);backdrop-filter:blur(6px);color:var(--ink);font:600 13px "Space Grotesk",sans-serif;
    cursor:pointer;pointer-events:auto;white-space:nowrap;}
  .miniBtn:active{transform:scale(.96);}

  /* Bütünleşik dizayn için blur ve dış çerçeve düzenlemeleri */
  .screen{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;
    background:rgba(7, 6, 26, 0.45); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); 
    padding:24px;overflow:auto;pointer-events:auto;}
  .card{width:min(430px,94vw);background:transparent;border:none;box-shadow:none;
    border-radius:24px; padding:24px 20px 20px;text-align:center;pointer-events:auto;}

  .title{font-size:48px;font-weight:700;line-height:1.1;margin:0 0 18px;
    background:linear-gradient(90deg,var(--cyan),var(--magenta));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 12px rgba(90,70,200,.22));}

  .field{margin-bottom:16px;text-align:left;}

  #nick{width:100%;padding:14px 16px;border-radius:14px;border:1px solid var(--stroke);
    background:rgba(6,4,20,.7);color:var(--ink);font:600 17px "Space Grotesk",sans-serif;outline:none;
    pointer-events:auto;user-select:text;-webkit-user-select:text;transition:border-color .15s, box-shadow .15s;}
  #nick:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(34,230,255,.16);}

  .skinpick{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:10px;}
  .arrow{width:52px;height:52px;flex:0 0 auto;border-radius:50%;border:1px solid var(--stroke);
    background:rgba(6,4,20,.5);color:var(--ink);font-size:22px;cursor:pointer;display:flex;align-items:center;
    justify-content:center;pointer-events:auto;transition:transform .12s,border-color .15s,background .15s;}
  .arrow:hover{border-color:var(--magenta);background:rgba(255,55,199,.12);}
  .arrow:active{transform:scale(.9);}
  .preview{flex:1;height:110px;border-radius:18px;border:1px solid var(--stroke);
    background:radial-gradient(80% 120% at 50% 0%, rgba(60,30,110,.5), rgba(5,4,20,.85));overflow:hidden;position:relative;}
  #prev{width:100%;height:100%;display:block;pointer-events:none;}
  
  /* Üst üste binmeleri düzelten margin ayarları */
  .skinname{font-size:15px;color:#cfd4ff;margin:8px 0 10px;font-weight:500;letter-spacing:.02em;}
  .dots{display:flex;gap:5px;justify-content:center;margin:0 0 16px;flex-wrap:wrap;}
  .dot{width:7px;height:7px;border-radius:50%;background:rgba(150,155,220,.3);cursor:pointer;pointer-events:auto;transition:background .15s,transform .15s;}
  .dot.on{background:var(--cyan);transform:scale(1.35);}

  .diff{display:flex;gap:8px;margin-bottom:14px;}
  .diff button{flex:1;padding:11px 6px;border-radius:12px;border:1px solid var(--stroke);
    background:rgba(6,4,20,.5);color:var(--muted);font:600 14px "Space Grotesk",sans-serif;cursor:pointer;pointer-events:auto;
    transition:border-color .15s,color .15s,background .15s;}
  .diff button.on{border-color:var(--cyan);color:var(--ink);background:rgba(34,230,255,.14);}
  button.diff.on{border-color:var(--cyan) !important;color:var(--ink) !important;background:rgba(34,230,255,.14) !important;}

  .soundrow{display:flex;align-items:center;gap:12px;}
  .soundbtn{padding:11px 14px;border-radius:12px;border:1px solid var(--stroke);background:rgba(6,4,20,.5);
    color:var(--ink);font:600 13px "Space Grotesk",sans-serif;cursor:pointer;pointer-events:auto;white-space:nowrap;}
  #vol{flex:1;accent-color:var(--cyan);pointer-events:auto;height:22px;}
  #vol:disabled{opacity:.35;filter:grayscale(0.6);pointer-events:none;}

  .play{width:100%;padding:16px;border:none;border-radius:16px;cursor:pointer;pointer-events:auto;margin-top:6px;
    font:700 19px "Space Grotesk",sans-serif;letter-spacing:.04em;color:#0a0620;
    background:linear-gradient(92deg,var(--cyan),var(--lime));
    box-shadow:0 12px 30px rgba(34,230,255,.28);transition:transform .12s,box-shadow .15s,filter .15s;}
  .play:hover{filter:brightness(1.06);box-shadow:0 16px 40px rgba(34,230,255,.4);}
  .play:active{transform:translateY(2px) scale(.99);}
  .hint{margin-top:14px;font-size:12px;color:var(--muted);line-height:1.5;}

  #over .title{font-size:42px;background:linear-gradient(92deg,var(--magenta),var(--gold));
    -webkit-background-clip:text;background-clip:text;color:transparent;}
  .goStats{display:flex;gap:12px;margin:8px 0 20px;}
  .goStats .box{flex:1;background:rgba(6,4,20,.5);border:1px solid var(--stroke);border-radius:16px;padding:14px 8px;}
  .goStats .box .n{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;}
  .goStats .box.len .n{color:var(--cyan);} .goStats .box.rank .n{color:var(--gold);}
  .goStats .box .k{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:2px;}
  .ghostbtn{margin-top:12px;width:100%;padding:13px;border-radius:14px;cursor:pointer;color:var(--ink);pointer-events:auto;
    background:transparent;border:1px solid var(--stroke);font:600 15px "Space Grotesk",sans-serif;transition:border-color .15s,background .15s;}
  .ghostbtn:hover{border-color:var(--magenta);background:rgba(255,55,199,.1);}
  .screen.hidden{display:none;}

  /* Custom Editor Updates */
  .custom-editor{margin-top:10px;display:none;flex-direction:column;gap:8px;align-items:center;}
  .custom-editor.show{display:flex;}
  .color-row{display:flex;align-items:center;gap:8px;}
  .custColor{width:42px;height:42px;border-radius:10px;border:2px solid var(--stroke);cursor:pointer;padding:2px;background:transparent;}
  .custColor::-webkit-color-swatch-wrapper{padding:0;}
  .custColor::-webkit-color-swatch{border:none;border-radius:8px;}
  .removeColorBtn{width:32px;height:32px;border-radius:50%;border:1px solid var(--stroke);
    background:rgba(255,55,55,.2);color:var(--ink);font-size:18px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;}
  .removeColorBtn:hover{background:rgba(34,230,255,.24);}
  .addColorBtn{padding:8px 14px;border-radius:12px;border:1px solid var(--stroke);
    background:rgba(6,4,20,.5);color:var(--ink);font:600 13px "Space Grotesk",sans-serif;cursor:pointer;pointer-events:auto;}
  .designBtn{margin-top:0px;margin-bottom:16px;width:100%;padding:10px 16px;border-radius:14px;border:1px solid var(--stroke);
    background:rgba(100,100,200,.2);color:var(--ink);font:600 14px "Space Grotesk",sans-serif;cursor:pointer;pointer-events:auto;}

  @media (max-width:520px){
    #board{width:150px;} .title{font-size:38px;}
    #stats .big{font-size:22px;}
  }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div class="hud hidden" id="hud">
  <div id="stats" class="hud">
    <div class="row len"><span class="lbl">Uzunluk</span></div>
    <div class="row len"><span class="big" id="lenVal">0</span></div>
    <div class="row rank"><span class="lbl">Sira</span></div>
    <div class="row rank"><span class="big" id="rankVal">-</span></div>
  </div>
  <div id="board" class="hud">
    <h4>Siralama</h4>
    <ol id="boardList"></ol>
  </div>
</div>

<div id="gameui" class="hidden">
  <button class="miniBtn" id="muteBtn2" type="button">Ses: Acik</button>
</div>

<div class="screen" id="menu">
  <div class="card">
    <h1 class="title">YILAN</h1>

    <div class="field">
      <input id="nick" maxlength="14" placeholder="adını yaz..." autocomplete="off" spellcheck="false" />
    </div>

    <div class="skinpick">
      <button class="arrow" id="prevSkin" type="button">&#8249;</button>
      <div class="preview"><canvas id="prev"></canvas></div>
      <button class="arrow" id="nextSkin" type="button">&#8250;</button>
    </div>
    <div class="skinname" id="skinNameLabel">-</div>
    <div class="dots" id="dots"></div>

    <div class="field" style="display:flex; gap:8px; margin-bottom:16px;">
      <button class="diff button on" id="modeSingle" style="flex:1; padding:12px; border-radius:12px; border:1px solid var(--stroke); background:rgba(6,4,20,0.5); color:var(--muted); font:600 14px 'Space Grotesk'; cursor:pointer;">🤖 Botlar</button>
      <button class="diff button" id="modeMulti" style="flex:1; padding:12px; border-radius:12px; border:1px solid var(--stroke); background:rgba(6,4,20,0.5); color:var(--muted); font:600 14px 'Space Grotesk'; cursor:pointer;">🌐 Online</button>
    </div>

    <div id="singleOptions">
      <div class="diff" id="diff">
        <button type="button" data-d="kolay">Kolay</button>
        <button type="button" data-d="normal">Normal</button>
        <button type="button" data-d="zor">Zor</button>
      </div>
    </div>

    <button class="designBtn" id="designBtn" type="button" style="margin-top:16px;">🎨 Tasarla</button>

    <div class="custom-editor" id="customEditor">
      <div id="customColors"></div>
      <button class="addColorBtn" id="addColorBtn" type="button">+ Renk Ekle</button>
    </div>

    <div class="field">
      <div class="soundrow">
        <button class="soundbtn" id="muteBtn" type="button">Acik</button>
        <input id="vol" type="range" min="0" max="100" value="60" />
      </div>
    </div>

    <button class="play" id="startBtn" type="button">BASLA</button>
    <p class="hint">Fare hareketiyle yönlendir, farenin sol tuşuna basılı tutarak hızlan. Mobil cihazlarda dokunup kaydır.</p>
  </div>
</div>

<div class="screen hidden" id="over">
  <div class="card">
    <h1 class="title">Oyun Bitti</h1>
    <p id="overMsg">Bir yilana carptin.</p>
    <div class="goStats">
      <div class="box len"><div class="n" id="finalLen">0</div><div class="k">Uzunluk</div></div>
      <div class="box rank"><div class="n" id="finalRank">-</div><div class="k">En iyi sira</div></div>
    </div>
    <button class="play" id="againBtn" type="button">TEKRAR OYNA</button>
    <button class="ghostbtn" id="menuBtn" type="button">Menuye Dön</button>
  </div>
</div>

<!-- socket.io istemcisi sunucunun kendisinden gelir (CDN bagimliligi yok, surum her zaman eslesir) -->

(function(){

  }
  window.addEventListener('resize', resize);

  function hex2rgb(h){ h = h.replace('#',''); return [parseInt(h.slice(0,2),16), parseInt(h.slice(2,4),16), parseInt(h.slice(4,6),16)]; }
  function lerpColors(cols, f){
    if (f <= 0) return cols[0];
    if (f >= 1) return cols[cols.length - 1];
    var p = f * (cols.length - 1), i = Math.floor(p), t = p - i;
    var a = hex2rgb(cols[i]), b = hex2rgb(cols[i+1]);
    return 'rgb(' + ((a[0]+(b[0]-a[0])*t)|0) + ',' + ((a[1]+(b[1]-a[1])*t)|0) + ',' + ((a[2]+(b[2]-a[2])*t)|0) + ')';

    { name:"Neon Pembe", type:"neon",     colors:["#ff2bd6"],                                 rep:"#ff2bd6", glow:true  },
    { name:"Zebra",      type:"stripes",  colors:["#f4f4f8","#111318"],                       rep:"#f4f4f8", glow:false },

    { name:"Lav",        type:"spots",    colors:["#1c1013","#ff5a00"],                       rep:"#ff5a00", glow:true  },
    { name:"Custom",     type:"custom",   colors:["#ff2bd6","#22e6ff"],                       rep:"#ff2bd6", glow:true  }
  ];
  var CUSTOM_SKIN_IDX = SKINS.length - 1;

  function segColor(sk, i, total, t){
    if(sk.type === 'custom'){
      var cols = sk.colors; if(!cols.length) return "#fff";
      return cols[i % cols.length];
    }
    switch(sk.type){
      case 'gradient': return lerpColors(sk.colors, total <= 1 ? 0 : i / (total - 1));
      case 'rainbow':  { var h = ((i * 7 - t * 60) % 360 + 360) % 360; return 'hsl(' + h + ',100%,56%)'; }
      case 'stripes':  return sk.colors[Math.floor(i / 3) % sk.colors.length];
      case 'spots':    return sk.colors[0];

      case 'galaxy':   { var f = ((i / Math.max(1,total)) + t * 0.05) % 1; return lerpColors(sk.colors, f); }
    }
    return sk.colors[0] || "#fff";
  }

  var state = 'menu';

  var SND = {

    _nb:null, _lp:0, musicTimer:null,

    musicIndex:0, nextNoteTime:0, musicOsc:null, musicGainNode:null, musicPlaying:false,
    ensure:function(){
      if (this.ctx) return true;
      try{
        var AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return false;
        this.ctx = new AC();
        this.master = this.ctx.createGain();
        this.master.gain.value = this.muted ? 0 : this.volume;
        this.master.connect(this.ctx.destination);
        this.musicGain = this.ctx.createGain(); this.musicGain.gain.value = 0; this.musicGain.connect(this.master);
        this.boostGain = this.ctx.createGain(); this.boostGain.gain.value = 0; this.boostGain.connect(this.master);
        return true;
      }catch(e){ return false; }
    },
    resume:function(){ try{ if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); }catch(e){} },
    startMusic:function(){
      if (!this.ctx || this.musicPlaying) return;
      this.musicPlaying = true;
      this.musicIndex = 0;
      this.nextNoteTime = this.ctx.currentTime + 0.08;
      this.stopMusicLoop();
      this.scheduleMusic();
      this.musicGain.gain.setValueAtTime(0, this.ctx.currentTime);
      this.musicGain.gain.linearRampToValueAtTime(0.06, this.ctx.currentTime + 1.2);
    },
    scheduleMusic:function(){
      if (!this.musicPlaying || !this.ctx) return;
      var now = this.ctx.currentTime;
      while (this.nextNoteTime < now + 1.5) {
        var freq = this.musicNotes[this.musicIndex];
        var dur = this.musicDurs[this.musicIndex];
        if (freq > 0) {
          var osc = this.ctx.createOscillator();
          osc.type = 'square';
          osc.frequency.value = freq;
          var env = this.ctx.createGain();
          env.gain.setValueAtTime(0.0001, this.nextNoteTime);
          env.gain.linearRampToValueAtTime(0.09, this.nextNoteTime + 0.02);
          env.gain.exponentialRampToValueAtTime(0.0005, this.nextNoteTime + dur * 0.9);
          osc.connect(env);
          env.connect(this.musicGain);
          osc.start(this.nextNoteTime);
          osc.stop(this.nextNoteTime + dur + 0.05);
        }
        this.nextNoteTime += dur;
        this.musicIndex = (this.musicIndex + 1) % this.musicNotes.length;
      }
      var self = this;
      this.musicTimer = setTimeout(function(){ self.scheduleMusic(); }, 400);
    },
    stopMusicLoop:function(){
      if (this.musicTimer){ clearTimeout(this.musicTimer); this.musicTimer = null; }
    },
    stopMusic:function(){
      this.musicPlaying = false;
      this.stopMusicLoop();
      if (this.ctx && this.musicGain){
        try{
          this.musicGain.gain.cancelScheduledValues(this.ctx.currentTime);
          this.musicGain.gain.setValueAtTime(0, this.ctx.currentTime);
        }catch(e){}
      }
    },
    pop:function(){
      if (!this.ctx || this.muted) return;
      var now = performance.now(); if (now - this._lp < 55) return; this._lp = now;
      try{
        var t = this.ctx.currentTime, f = 900 + Math.random()*500;
        var o = this.ctx.createOscillator(); o.type='square';
        o.frequency.setValueAtTime(f, t);
        o.frequency.exponentialRampToValueAtTime(f*2.3, t+0.03);
        var g = this.ctx.createGain(); g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.1, t+0.006);
        g.gain.exponentialRampToValueAtTime(0.0003, t+0.07);
        o.connect(g); g.connect(this.master);
        o.start(t); o.stop(t+0.09);
      }catch(e){}
    },
    death:function(){
      if (!this.ensure() || this.muted) return; this.resume();
      try{
        var t = this.ctx.currentTime;
        var o = this.ctx.createOscillator(); o.type='square';
        o.frequency.setValueAtTime(500, t);
        o.frequency.exponentialRampToValueAtTime(60, t+0.4);
        var g = this.ctx.createGain();
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.22, t+0.02);
        g.gain.exponentialRampToValueAtTime(0.0005, t+0.45);
        o.connect(g); g.connect(this.master);
        o.start(t); o.stop(t+0.5);
        var n = this.ctx.createBufferSource(); n.buffer = this.noise();
        var nf = this.ctx.createBiquadFilter(); nf.type='bandpass'; nf.frequency.value=700;
        var ng = this.ctx.createGain(); ng.gain.setValueAtTime(0.14, t);
        ng.gain.exponentialRampToValueAtTime(0.0004, t+0.28);
        n.connect(nf); nf.connect(ng); ng.connect(this.master);
        n.start(t); n.stop(t+0.3);
      }catch(e){}
    },
    noise:function(){
      if (this._nb) return this._nb;
      var len = Math.floor(this.ctx.sampleRate * 1.5);
      var b = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
      var d = b.getChannelData(0);
      for (var i=0;i<len;i++) d[i] = Math.random()*2-1;
      this._nb = b; return b;
    },
    setBoost:function(on){
      if (on === this.boostOn) return; this.boostOn = on;
      if (!this.ctx) return;
      try{ this.boostGain.gain.setTargetAtTime(on ? 0.07 : 0, this.ctx.currentTime, 0.04); }catch(e){}
    },
    setVolume:function(v){
      this.volume = v;
      if (this.master && !this.muted) try{ this.master.gain.setTargetAtTime(v, this.ctx.currentTime, 0.05); }catch(e){}
    },
    setMuted:function(m){
      this.muted = m;
      if (this.master) try{ this.master.gain.setTargetAtTime(m ? 0 : this.volume, this.ctx.currentTime, 0.05); }catch(e){}
    }
  };

  function loadSettings(){
    try{
      var v = localStorage.getItem('ny_vol'); if (v !== null) SND.volume = clamp(parseFloat(v), 0, 1);
      var m = localStorage.getItem('ny_muted'); if (m !== null) SND.muted = (m === '1');
      var d = localStorage.getItem('ny_diff'); if (d && DIFF[d]) difficulty = d;
      var cust = localStorage.getItem('ny_custColors');
      if (cust) { var arr = JSON.parse(cust); if (Array.isArray(arr) && arr.length) SKINS[CUSTOM_SKIN_IDX].colors = arr; }
    }catch(e){}
  }
  function saveSettings(){
    try{
      localStorage.setItem('ny_vol', String(SND.volume));
      localStorage.setItem('ny_muted', SND.muted ? '1' : '0');
      localStorage.setItem('ny_diff', difficulty);
      localStorage.setItem('ny_custColors', JSON.stringify(SKINS[CUSTOM_SKIN_IDX].colors));
    }catch(e){}
  }

  function makeSnake(x, y, angle, length, skinIdx, name, isPlayer){
    var s = { angle:angle, target:angle, length:length, skin:skinIdx, name:name, isPlayer:isPlayer,
      alive:true, spawn:performance.now(), r:radiusFor(length), segs:[], boosting:false, lastDrop:0,
      b:{ wander:angle, nextWander:0, mode:'wander', boostWant:false } };
    var sp = spacingFor(s.r), n = segCountFor(length);
    for (var i = 0; i < n; i++)
      s.segs.push({ x: x - Math.cos(angle) * sp * i, y: y - Math.sin(angle) * sp * i });
    return s;
  }
  function randSpawnPos(){
    var a = rand(0, Math.PI * 2), d = rand(0, WORLD.r * 0.82);
    return { x: Math.cos(a) * d, y: Math.sin(a) * d };
  }
  function spawnBot(){
    var p = randSpawnPos();
    var b = makeSnake(p.x, p.y, rand(0, Math.PI * 2), rand(10, 70),
      (Math.random() * (SKINS.length-1)) | 0, nextName(), false);
    bots.push(b);
    return b;
  }
  function dropFood(x, y, color, val, burst){
    var vx = 0, vy = 0;
    if (burst){ var a = rand(0, Math.PI*2), sp = rand(burst*0.35, burst); vx = Math.cos(a)*sp; vy = Math.sin(a)*sp; }
    foods.push({ x:x, y:y, r:rand(4,6), val:val, color:color, phase:Math.random()*6, vx:vx, vy:vy });
  }
  function spawnFood(n){
    for (var k = 0; k < n; k++){
      var a = rand(0, Math.PI * 2), d = Math.sqrt(Math.random()) * (WORLD.r - 40);
      foods.push({ x: Math.cos(a) * d, y: Math.sin(a) * d, r: rand(3, 5),
        val: 1, color: 'hsl(' + ((Math.random()*360)|0) + ',90%,62%)', phase: Math.random() * 6, vx:0, vy:0 });
    }
  }

  function key(x, y){ return (Math.floor(x / CELL)) + "," + (Math.floor(y / CELL)); }
  var segGrid = {};
  var foodGrid = {};
  function gridPush(g, x, y, obj){ var k = key(x, y); var a = g[k]; if (!a){ a = []; g[k] = a; } a.push(obj); }
  var _nb = [];
  function gridNeighbors(g, x, y){
    _nb.length = 0;
    var cx = Math.floor(x / CELL), cy = Math.floor(y / CELL);
    for (var i = -1; i <= 1; i++) for (var j = -1; j <= 1; j++){
      var a = g[(cx+i) + "," + (cy+j)];
      if (a) for (var n = 0; n < a.length; n++) _nb.push(a[n]);
    }
  }
  function rebuildGrids(){
    segGrid = {}; foodGrid = {};
    var all = allSnakes();
    for (var si = 0; si < all.length; si++){
      var s = all[si], segs = s.segs;
      for (var i = 0; i < segs.length; i++){
        if (i !== 0 && (i & 1)) continue;
        gridPush(segGrid, segs[i].x, segs[i].y, { x: segs[i].x, y: segs[i].y, r: s.r * (i === 0 ? 1 : 1.1), owner: s });
      }
    }
    for (var f = 0; f < foods.length; f++){
      if (!foods[f].dead) gridPush(foodGrid, foods[f].x, foods[f].y, foods[f]);
    }
  }
  // Menu her zaman yerel (bot) dunyasini simule eder; oyun icinde moda gore ayrilir
  function usingLocalWorld(){
    return gameMode === 'single' || state === 'menu';
  }
  function allSnakes(){
    var a = [];
    if (player && player.alive && state !== 'menu') a.push(player);
    if (usingLocalWorld()){
      for (var i = 0; i < bots.length; i++) if (bots[i].alive) a.push(bots[i]);
    } else {
      for (var id in otherPlayers) a.push(otherPlayers[id]);
    }
    return a;
  }

  function boostEconomy(s, dt, now){
    if (!s.boosting) return;
    if (s.length > BOOST_MIN_LEN){
      s.length -= BOOST_COST * dt;
      if (now - s.lastDrop > 110){
        s.lastDrop = now;
        var tail = s.segs[s.segs.length - 1];
        dropFood(tail.x, tail.y, SKINS[s.skin].rep, 3, 1.4);
      }
    } else {
      s.boosting = false;
    }
  }

  function stepSnake(s, dt){
    s.r = radiusFor(s.length);
    var sp = spacingFor(s.r), speed = BASE_SPEED * dt * (s.boosting ? BOOST_MULT : 1);
    var d = angDiff(s.target, s.angle);
    var maxT = TURN * dt;
    s.angle += clamp(d, -maxT, maxT);
    var head = s.segs[0];
    head.x += Math.cos(s.angle) * speed;
    head.y += Math.sin(s.angle) * speed;
    var want = segCountFor(s.length);
    while (s.segs.length < want){ var t = s.segs[s.segs.length - 1]; s.segs.push({ x: t.x, y: t.y }); }
    while (s.segs.length > want) s.segs.pop();
    for (var i = 1; i < s.segs.length; i++){
      var a = s.segs[i - 1], b = s.segs[i];
      var dx = a.x - b.x, dy = a.y - b.y, dd = Math.hypot(dx, dy);
      if (dd > sp){ var m = (dd - sp) / dd; b.x += dx * m; b.y += dy * m; }
    }
  }

  function botThink(s, now){
    var head = s.segs[0];
    var dc = Math.hypot(head.x, head.y);
    if (dc > WORLD.r - 300){ s.target = Math.atan2(-head.y, -head.x) + rand(-0.2, 0.2); s.boosting = false; return; }
    var cfg = DIFF[difficulty];
    if (now > s.b.nextWander){
      s.b.wander = s.angle + rand(-cfg.chaos, cfg.chaos);
      s.b.nextWander = now + rand(500, 1400);
      var roll = Math.random();
      var canChase = player && player.alive &&
        Math.hypot(player.segs[0].x - head.x, player.segs[0].y - head.y) < cfg.chaseRange;
      if (canChase && roll < cfg.aggro) s.b.mode = 'chase';
      else if (roll < cfg.seek) s.b.mode = 'seek';
      else s.b.mode = 'wander';
      s.b.boostWant = (s.b.mode === 'chase') && (Math.random() < cfg.boost * 3);
    }
    var tgt = s.b.wander;
    if (s.b.mode === 'seek'){
      gridNeighbors(foodGrid, head.x, head.y);
      var best = 1e9, bx = 0, by = 0, found = false;
      for (var i = 0; i < _nb.length; i++){
        var f = _nb[i]; if (f.dead) continue;
        var fx = f.x - head.x, fy = f.y - head.y, d2 = fx*fx + fy*fy;
        if (d2 < best){ best = d2; bx = f.x; by = f.y; found = true; }
      }
      if (found) tgt = Math.atan2(by - head.y, bx - head.x);
    } else if (s.b.mode === 'chase' && player && player.alive){
      var ph = player.segs[0];
      var lead = 120;
      var aimx = ph.x + Math.cos(player.angle) * lead;
      var aimy = ph.y + Math.sin(player.angle) * lead;
      tgt = Math.atan2(aimy - head.y, aimx - head.x);
    }
    var ax = head.x + Math.cos(s.angle) * (s.r + 46);
    var ay = head.y + Math.sin(s.angle) * (s.r + 46);
    gridNeighbors(segGrid, ax, ay);
    for (var j = 0; j < _nb.length; j++){
      var e = _nb[j]; if (e.owner === s) continue;
      var ex = e.x - ax, ey = e.y - ay;
      if (ex*ex + ey*ey < (e.r + s.r + 20) * (e.r + s.r + 20)){ tgt = s.angle + (Math.random() < 0.5 ? 1 : -1) * 0.9; s.b.boostWant = false; break; }
    }
    s.target = tgt;
    s.boosting = s.b.boostWant && s.length > BOOST_MIN_LEN;
  }

  function collisions(now){
    if (state !== 'play') return;
    var all = allSnakes();
    for (var si = 0; si < all.length; si++){
      var s = all[si];
      if (now - s.spawn < PROTECT) continue;
      var head = s.segs[0];
      if (Math.hypot(head.x, head.y) > WORLD.r - s.r){ killSnake(s); continue; }
      gridNeighbors(segGrid, head.x, head.y);
      for (var i = 0; i < _nb.length; i++){
        var e = _nb[i]; if (e.owner === s) continue;
        var dx = e.x - head.x, dy = e.y - head.y;
        var rr = s.r * 0.72 + e.r;
        if (dx*dx + dy*dy < rr * rr){ killSnake(s); break; }
      }
    }
  }
  function eating(){
    if (state !== 'play') return;
    var all = allSnakes();
    var any = false;
    for (var si = 0; si < all.length; si++){
      var s = all[si], head = s.segs[0];
      gridNeighbors(foodGrid, head.x, head.y);
      var pull = s.r * 4.5;
      for (var i = 0; i < _nb.length; i++){
        var f = _nb[i]; if (f.dead) continue;
        var dx = head.x - f.x, dy = head.y - f.y, d = Math.hypot(dx, dy);
        if (d < s.r + pull){ f.x += dx / d * Math.min(6, d) * 0.35; f.y += dy / d * Math.min(6, d) * 0.35; }
        if (d < s.r + f.r + 3){ s.length += f.val; f.dead = true; any = true; if (s.isPlayer) SND.pop(); }
      }
    }
    if (any) foods = foods.filter(function(f){ return !f.dead; });
  }

  function killSnake(s){
    var rep = SKINS[s.skin].rep;
    var cx = s.segs[0].x, cy = s.segs[0].y;
    for (var i = 0; i < s.segs.length; i += 2){
      var g = s.segs[i];
      var ang = Math.atan2(g.y - cy, g.x - cx) + rand(-0.5, 0.5);
      var sp = rand(1.5, 5.5);
      foods.push({ x:g.x, y:g.y, r:rand(4,7), val:Math.max(2, Math.round(s.r*0.5)), color:rep,
        phase:Math.random()*6, vx:Math.cos(ang)*sp, vy:Math.sin(ang)*sp });
    }
    bursts.push({ x:cx, y:cy, startR:s.r, max:s.r*11, p:0, color:rep });
    for (var q = 0; q < 14; q++){
      var a2 = rand(0, Math.PI*2), s2 = rand(2, 7.5);
      particles.push({ x:cx, y:cy, vx:Math.cos(a2)*s2, vy:Math.sin(a2)*s2, life:1, color:rep });
    }
    s.alive = false;
    if (s.isPlayer){ SND.death(); endGame("Bir yilana carptin."); }
  }

  function maintain(){
    bots = bots.filter(function(b){ return b.alive; });
    while (bots.length < BOT_COUNT) spawnBot();
    if (foods.length < FOOD_TARGET) spawnFood(Math.min(30, FOOD_TARGET - foods.length));
  }

  function foodMotion(dt){
    for (var i = 0; i < foods.length; i++){
      var f = foods[i];
      if (!f.vx && !f.vy) continue;
      f.x += f.vx * dt; f.y += f.vy * dt;
      f.vx *= 0.90; f.vy *= 0.90;
      if (Math.abs(f.vx) < 0.05 && Math.abs(f.vy) < 0.05){ f.vx = 0; f.vy = 0; }
    }
  }
  function updateEffects(dt){
    for (var i = bursts.length - 1; i >= 0; i--){
      bursts[i].p += dt * 0.045;
      if (bursts[i].p >= 1) bursts.splice(i, 1);
    }
    for (var j = particles.length - 1; j >= 0; j--){
      var p = particles[j];
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.vx *= 0.92; p.vy *= 0.92;
      p.life -= dt * 0.03;
      if (p.life <= 0) particles.splice(j, 1);
    }
  }

  function updateWorld(dt, now){
    if (state === 'play' && player && player.alive){
      if (ctrl.hasDir) player.target = ctrl.angle;
      player.boosting = !!(touchBoost || mouseBoost || keyBoost);
      SND.setBoost(player.boosting);
    } else {
      SND.setBoost(false);
    }
    
    // Yerel dunya (tek kisilik oyun veya menu arka plani): botlar + yerel yem mantigi
    if (usingLocalWorld()) {
        for (var i = 0; i < bots.length; i++) botThink(bots[i], now);
        if (state === 'play' && player && player.alive) boostEconomy(player, dt, now);
        for (var j = 0; j < bots.length; j++) boostEconomy(bots[j], dt, now);
        if (state === 'play' && player && player.alive) stepSnake(player, dt);
        for (var k = 0; k < bots.length; k++) stepSnake(bots[k], dt);
        foodMotion(dt);
        updateEffects(dt);
        rebuildGrids();
        collisions(now);
        eating();
        maintain();
    } else {
        // Multi mode: Sadece yerel efektler ve oyuncu hareketi (tahminleme için)
        if (state === 'play' && player && player.alive) stepSnake(player, dt);
        updateEffects(dt);
        // Multi mode'da yemek yeme/çarpışma server kontrolünde ama görsel yemek hareketi kalabilir
        foodMotion(dt);
        // Diğer oyuncuları sunucu anlık görüntüsüne doğru yumuşat (20fps zıplamayı önler)
        interpolateOthers(dt);
    }
    var tx = 0, ty = 0;
    if ((state === 'play' || state === 'dead') && player && player.alive){ tx = player.segs[0].x; ty = player.segs[0].y; }
    else if (state === 'menu'){ tx = Math.cos(now*0.0002)*300; ty = Math.sin(now*0.0003)*250; }
    else { var L = leaderboard(1)[0]; if (L){ tx = L.segs[0].x; ty = L.segs[0].y; } }
    cam.x += (tx - cam.x) * 0.12;
    cam.y += (ty - cam.y) * 0.12;
  }

  function leaderboard(n){
    var a = allSnakes().slice().sort(function(x, y){ return y.length - x.length; });
    return n ? a.slice(0, n) : a;
  }
  function playerRank(){
    if (!player) return { rank: '-', total: 0 };
    var a = allSnakes().slice().sort(function(x, y){ return y.length - x.length; });
    var idx = a.indexOf(player);
    return { rank: idx >= 0 ? idx + 1 : '-', total: a.length };
  }

  function drawSnake(s, t, viewMinX, viewMaxX, viewMinY, viewMaxY){
    var segs = s.segs, n = segs.length;
    if (!n) return;
    var sk = s.customSkin || SKINS[s.skin] || SKINS[0];
    var glow = (sk.glow && s.isPlayer) || (s.isPlayer && s.boosting);
    if (glow){ ctx.shadowColor = sk.rep; ctx.shadowBlur = s.boosting ? 22 : 16; }
    for (var i = n - 1; i >= 0; i--){
      var g = segs[i];
      if (g.x < viewMinX || g.x > viewMaxX || g.y < viewMinY || g.y > viewMaxY) continue;
      ctx.fillStyle = segColor(sk, i, n, t);
      ctx.beginPath();
      ctx.arc(g.x, g.y, s.r, 0, Math.PI * 2);
      ctx.fill();
      if (sk.type === 'spots' && i % 3 === 0){
        ctx.fillStyle = sk.colors[1] || '#fff';
        ctx.beginPath();
        ctx.arc(g.x, g.y, s.r * 0.45, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    if (glow) ctx.shadowBlur = 0;
    var head = segs[0];
    var ex = Math.cos(s.angle), ey = Math.sin(s.angle);
    var px = -ey, py = ex, eo = s.r * 0.42, er = s.r * 0.42;
    for (var side = -1; side <= 1; side += 2){
      var eX = head.x + ex * s.r * 0.32 + px * side * eo;
      var eY = head.y + ey * s.r * 0.32 + py * side * eo;
      ctx.fillStyle = "#fff";
      ctx.beginPath(); ctx.arc(eX, eY, er, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#0a0714";
      ctx.beginPath(); ctx.arc(eX + ex * er * 0.5, eY + ey * er * 0.5, er * 0.55, 0, Math.PI * 2); ctx.fill();
    }
    if (s.r > 6){
      ctx.fillStyle = "rgba(255,255,255,.9)";
      ctx.font = '600 ' + Math.max(11, s.r * 0.9) + 'px "Space Grotesk", sans-serif';
      ctx.textAlign = "center"; ctx.textBaseline = "bottom";
      ctx.fillText(s.name, head.x, head.y - s.r - 4);
    }
  }

  function render(t){
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    var bg = ctx.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, "#0a0722"); bg.addColorStop(1, "#050414");
    ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);

    var menuMode = (state === 'menu');
    if (menuMode) ctx.globalAlpha = 0.45;

    var viewScale = 1.0;
    ctx.save();
    ctx.translate(W / 2, H / 2);
    ctx.scale(viewScale, viewScale);
    ctx.translate(-cam.x, -cam.y);
    var halfW = (W / 2) / viewScale + 120, halfH = (H / 2) / viewScale + 120;
    var viewMinX = cam.x - halfW, viewMaxX = cam.x + halfW;
    var viewMinY = cam.y - halfH, viewMaxY = cam.y + halfH;

    ctx.fillStyle = "rgba(120,120,220,.10)";
    var gs = 100;
    var sx = Math.floor(viewMinX / gs) * gs, sy = Math.floor(viewMinY / gs) * gs;
    for (var gx = sx; gx < viewMaxX; gx += gs)
      for (var gy = sy; gy < viewMaxY; gy += gs){
        if (gx * gx + gy * gy > WORLD.r * WORLD.r) continue;
        ctx.beginPath(); ctx.arc(gx, gy, 1.4, 0, Math.PI * 2); ctx.fill();
      }
    ctx.lineWidth = 8;
    ctx.strokeStyle = "rgba(34,230,255,.55)";
    ctx.shadowColor = "rgba(34,230,255,.45)"; ctx.shadowBlur = 24;
    ctx.beginPath(); ctx.arc(0, 0, WORLD.r, 0, Math.PI * 2); ctx.stroke();
    ctx.shadowBlur = 0;
    for (var fi = 0; fi < foods.length; fi++){
      var f = foods[fi];
      if (f.x < viewMinX || f.x > viewMaxX || f.y < viewMinY || f.y > viewMaxY) continue;
      var pr = 1 + Math.sin(t * 3 + (f.phase || 0)) * 0.14;
      ctx.fillStyle = f.color;
      ctx.beginPath(); ctx.arc(f.x, f.y, f.r * pr, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 0.25;
      ctx.beginPath(); ctx.arc(f.x, f.y, f.r * pr * 2.1, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = menuMode ? 0.45 : 1;
    }
    // Cizim listesi: yerel dunyada botlar, online'da diger oyuncular
    var all = [];
    if (player && player.alive && state !== 'menu') all.push(player);
    if (usingLocalWorld()){
      for (var b2 = 0; b2 < bots.length; b2++) if (bots[b2].alive) all.push(bots[b2]);
    } else {
      for (var id in otherPlayers) all.push(otherPlayers[id]);
    }
    all.sort(function(a, b){ return a.length - b.length; });

    for (var i = 0; i < all.length; i++) {
        drawSnake(all[i], t, viewMinX, viewMaxX, viewMinY, viewMaxY);
    }
    for (var bi = 0; bi < bursts.length; bi++){
      var b = bursts[bi];
      var ease = 1 - Math.pow(1 - b.p, 2);
      var br = b.startR + (b.max - b.startR) * ease;
      ctx.globalAlpha = (1 - b.p) * 0.6;
      ctx.strokeStyle = b.color; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(b.x, b.y, br, 0, Math.PI * 2); ctx.stroke();
    }
    for (var pi = 0; pi < particles.length; pi++){
      var p = particles[pi];
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, 3, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = menuMode ? 0.45 : 1;
    ctx.restore();
    ctx.globalAlpha = 1;

    if ((state === 'play' || state === 'dead') && player && player.alive){
      var mmR = 62, ox = W - mmR - 18, oy = H - mmR - 18;
      ctx.fillStyle = 'rgba(10,8,30,.5)';
      ctx.beginPath(); ctx.arc(ox, oy, mmR, 0, Math.PI*2); ctx.fill();
      ctx.save();
      ctx.beginPath(); ctx.arc(ox, oy, mmR, 0, Math.PI*2); ctx.clip();
      ctx.fillStyle = 'rgba(150,200,255,.22)';
      for (var mf = 0; mf < foods.length; mf += 10){
        var ff = foods[mf];
        var fmx = ox + (ff.x / WORLD.r) * mmR, fmy = oy + (ff.y / WORLD.r) * mmR;
        ctx.fillRect(fmx, fmy, 1.4, 1.4);
      }
      var lb = leaderboard(0), cnt = Math.min(lb.length, 7);
      for (var mi = 0; mi < cnt; mi++){
        var sn = lb[mi]; if (sn === player) continue;
        var mx = ox + (sn.segs[0].x / WORLD.r) * mmR, my = oy + (sn.segs[0].y / WORLD.r) * mmR;
        ctx.fillStyle = 'rgba(255,90,160,.7)';
        ctx.beginPath(); ctx.arc(mx, my, 2, 0, Math.PI*2); ctx.fill();
      }
      var pxp = ox + (player.segs[0].x / WORLD.r) * mmR, pyp = oy + (player.segs[0].y / WORLD.r) * mmR;
      ctx.fillStyle = '#22e6ff'; ctx.shadowColor = '#22e6ff'; ctx.shadowBlur = 8;
      ctx.beginPath(); ctx.arc(pxp, pyp, 3.4, 0, Math.PI*2); ctx.fill(); ctx.shadowBlur = 0;
      ctx.restore();
      ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(140,150,255,.35)';
      ctx.beginPath(); ctx.arc(ox, oy, mmR, 0, Math.PI*2); ctx.stroke();
    }
  }

  var el = {};
  var hudTick = 0;
  function escapeHtml(str){ return String(str).replace(/[&<>"']/g, function(m){ return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[m]; }); }
  function updateHUD(){
    if (state !== 'play' || !player) return;
    el.lenVal.textContent = Math.floor(player.length);
    var r = playerRank();
    el.rankVal.textContent = r.rank + " / " + r.total;

    if ((hudTick++ % 12) === 0){

      }
      el.boardList.innerHTML = html;
    }

  var last = performance.now();
  function loop(now){
    try {
      var dt = (now - last) / 16.6667; last = now;
      if (dt > 2.2) dt = 2.2;
      var t = now / 1000;

      var vx = 0, vy = 0;
      if (state === 'play'){
        if (keys['w'] || keys['ArrowUp']) vy -= 1;
        if (keys['s'] || keys['ArrowDown']) vy += 1;
        if (keys['a'] || keys['ArrowLeft']) vx -= 1;
        if (keys['d'] || keys['ArrowRight']) vx += 1;
        var kl = Math.hypot(vx, vy);
        
        if (kl > 0.01) { 
          ctrl.angle = Math.atan2(vy, vx); 
          ctrl.hasDir = true; 
          ctrl.useMouse = false;
        } 
        else if (ctrl.useMouse) { 
          ctrl.angle = Math.atan2(ctrl.mouseY - H/2, ctrl.mouseX - W/2); 
          ctrl.hasDir = true; 
        }
      }

      updateWorld(dt, now);

      if (state === 'play' && player && player.alive && gameMode === 'multi'){
        // Konumu 20Hz'de, yuvarlanmis koordinatlarla gonder (bant genisligi icin).
        // NOT: length gonderilmez - uzunlukta sunucu otoritedir.
        if ((netTick++ % 3) === 0){
          var segsOut = [];
          for (var si = 0; si < player.segs.length; si++){
            segsOut.push({ x: Math.round(player.segs[si].x), y: Math.round(player.segs[si].y) });
          }
          socket.emit('update', {
              x: segsOut[0].x,
              y: segsOut[0].y,
              angle: player.angle,
              segs: segsOut,
              boosting: !!player.boosting
          });
        }

        // Yem yeme: miknatis efekti + iyimser yerel silme, sunucu onayi arkadan gelir
        var head = player.segs[0], pull = player.r * 4.5;
        for (var i = foods.length - 1; i >= 0; i--) {
            var f = foods[i];
            var dx = head.x - f.x, dy = head.y - f.y, d2 = dx*dx + dy*dy;
            if (d2 < (player.r + pull) * (player.r + pull)){
                var dd = Math.sqrt(d2) || 1;
                f.x += dx / dd * Math.min(6, dd) * 0.35;
                f.y += dy / dd * Math.min(6, dd) * 0.35;
                if (dd < player.r + f.r + 3){
                    foods.splice(i, 1);
                    SND.pop();
                    socket.emit('eatFood', f.id);
                }
            }
        }
      }
      render(t);
      updateHUD();
    } catch (err) {
      if (window.console && console.error) console.error(err);
    }
    requestAnimationFrame(loop);
  }

  function startGame(){
    SND.ensure(); SND.startMusic();
    var nick = (el.nick.value || '').trim().slice(0, 14) || 'sen';
    
    if (gameMode === 'multi') {

        });

        cam.x = player.segs[0].x; cam.y = player.segs[0].y;
        // Botları ve yemekleri sıfırla

  function syncOtherPlayer(p){
    if (!p) return p;
    p.isPlayer = false;
    p.alive = true;
    p.r = radiusFor(p.length || 10);
    // Ozel skin renkleri geldiyse o oyuncuya ozel skin kur
    if (p.skinColors && p.skinColors.length){
      p.customSkin = { name:'Custom', type:'custom', colors:p.skinColors, rep:p.skinColors[0], glow:true };
    }
    var incoming = (p.segs && p.segs.length) ? p.segs : [{ x: p.x || 0, y: p.y || 0 }];
    var prev = otherPlayers[p.id];
    if (prev && prev.segs && prev.segs.length){
      // Görünen gövdeyi koru, en son anlık görüntüyü hedef yap (yumuşatma için)
      p.segs = prev.segs;
      p.targetSegs = incoming;
    } else {
      p.segs = incoming.map(function(s){ return { x:s.x, y:s.y }; });
      p.targetSegs = incoming;
    }
    return p;
  }

  // Diğer oyuncuların görünen segmentlerini sunucudan gelen hedefe doğru kaydır
  function interpolateOthers(dt){
    for (var oid in otherPlayers){
      var op = otherPlayers[oid];
      var tgt = op.targetSegs;
      if (!tgt || !tgt.length) continue;
      while (op.segs.length < tgt.length){ var l = op.segs[op.segs.length-1] || tgt[0]; op.segs.push({ x:l.x, y:l.y }); }
      while (op.segs.length > tgt.length) op.segs.pop();
      var f = Math.min(1, 0.35 * dt);
      for (var i = 0; i < op.segs.length; i++){
        op.segs[i].x += (tgt[i].x - op.segs[i].x) * f;
        op.segs[i].y += (tgt[i].y - op.segs[i].y) * f;
      }
    }
  }

  socket.on('init', function(data) {
    if (gameMode !== 'multi' || !player || !data) return;
    myId = data.id;
    player.id = myId;
    if (data.worldSize) WORLD.r = data.worldSize;
    foods = data.foods || [];
    var me = data.players && data.players[myId];
    if (me){
      // Tum govdeyi spawn noktasina tasi, kamerayi oraya kilitle
      for (var i = 0; i < player.segs.length; i++){
        player.segs[i].x = me.x;
        player.segs[i].y = me.y;
      }
      player.angle = player.target = me.angle;
      cam.x = me.x; cam.y = me.y;
    }
    otherPlayers = {};
    for (var id in data.players) {
        if (id !== myId) otherPlayers[id] = syncOtherPlayer(data.players[id]);
    }
  });

  socket.on('stateUpdate', function(players) {
    if (gameMode !== 'multi' || !myId) return;
    for (var id in players) {
        if (id === myId) {
            if (player) player.length = players[id].length;
        } else {
            otherPlayers[id] = syncOtherPlayer(players[id]);
        }
    }
    // Anlik goruntude olmayan oyunculari temizle (kacirilan olaylara karsi)
    for (var oid in otherPlayers) {
        if (!players[oid]) delete otherPlayers[oid];
    }
  });

  socket.on('newPlayer', function(p) {
    if (gameMode !== 'multi' || !p || p.id === myId) return;
    otherPlayers[p.id] = syncOtherPlayer(p);
  });

  socket.on('playerDisconnected', function(id) {
    delete otherPlayers[id];
  });

  socket.on('playerDied', function(id) {
    if (gameMode !== 'multi') return;
    if (id === myId) {
      if (player) {
        player.alive = false;
        var hp = player.segs[0];
        bursts.push({ x:hp.x, y:hp.y, startR:player.r, max:player.r*11, p:0,
          color:(player.customSkin || SKINS[player.skin]).rep });
      }
      if (state === 'play') { SND.death(); endGame("Bir yilana carptin."); }
    } else {
      var op = otherPlayers[id];
      if (op && op.segs && op.segs.length) {
        var rep = (op.customSkin || SKINS[op.skin] || SKINS[0]).rep;
        bursts.push({ x:op.segs[0].x, y:op.segs[0].y, startR:op.r || 8, max:(op.r || 8)*11, p:0, color:rep });
      }
      delete otherPlayers[id];
    }
  });

  socket.on('foodEaten', function(data) {

  function drawPreview(now){
    var w = prevCanvas.clientWidth, h = prevCanvas.clientHeight;
    if (w === 0 || h === 0){ requestAnimationFrame(drawPreview); return; }
    if (prevCanvas.width !== w * DPR || prevCanvas.height !== h * DPR){
      prevCanvas.width = w * DPR; prevCanvas.height = h * DPR;
    }
    pctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    pctx.clearRect(0, 0, w, h);
    var sk = SKINS[chosenSkin], t = now / 1000, n = 22, r = 12;
    if (sk.glow){ pctx.shadowColor = sk.rep; pctx.shadowBlur = 14; }
    for (var i = n - 1; i >= 0; i--){
      var x = w - 24 - i * (r * 0.92);
      var y = h / 2 + Math.sin(t * 2.2 + i * 0.5) * (h * 0.16);
      pctx.fillStyle = segColor(sk, i, n, t);
      pctx.beginPath(); pctx.arc(x, y, r, 0, Math.PI * 2); pctx.fill();
      if (sk.type === 'spots' && i % 3 === 0){
        pctx.fillStyle = sk.colors[1] || '#fff';
        pctx.beginPath(); pctx.arc(x, y, r * 0.45, 0, Math.PI * 2); pctx.fill();
      }
    }
    pctx.shadowBlur = 0;
    var hx = w - 24, hy = h / 2 + Math.sin(t * 2.2) * (h * 0.16);
    pctx.fillStyle = "#fff";
    pctx.beginPath(); pctx.arc(hx + 4, hy - 4, 4.2, 0, Math.PI * 2); pctx.fill();
    pctx.beginPath(); pctx.arc(hx + 4, hy + 4, 4.2, 0, Math.PI * 2); pctx.fill();
    pctx.fillStyle = "#0a0714";
    pctx.beginPath(); pctx.arc(hx + 6, hy - 4, 2.1, 0, Math.PI * 2); pctx.fill();
    pctx.beginPath(); pctx.arc(hx + 6, hy + 4, 2.1, 0, Math.PI * 2); pctx.fill();
    requestAnimationFrame(drawPreview);
  }

    pctx = prevCanvas.getContext('2d');

    loadSettings();

    // Mouse hareketleri sürekli kaydedilir
    window.addEventListener('mousemove', function(e){
      if (state === 'play'){

        ctrl.hasDir = true;
      }
    });
    // Sadece boost özelliğini açar

      mouseBoost = true;

      playMouseDown = false;

    window.addEventListener('touchstart', function(e){

      e.preventDefault();
      var t = e.touches[0];
      ctrl.anchorX = t.clientX; ctrl.anchorY = t.clientY;
      playTouchActive = true;
      var now = performance.now();
      if (doubleTapArmed && now - lastTapEnd < DOUBLE_MS) {
        touchBoost = true;
        doubleTapArmed = false;
      } else {
        touchBoost = false;
        doubleTapArmed = true;
      }
    }, { passive:false });
    window.addEventListener('touchmove', function(e){
      if (state !== 'play') return;
      e.preventDefault();
      var t = e.touches[0];
      var dx = t.clientX - ctrl.anchorX, dy = t.clientY - ctrl.anchorY;
      if (dx*dx + dy*dy > DEADZONE*DEADZONE){ 
        ctrl.angle = Math.atan2(dy, dx); 
        ctrl.hasDir = true; 
        ctrl.useMouse = false; // Dokunmatik önceliği ele alır
      }
    }, { passive:false });
    window.addEventListener('touchend', function(){
      if (playTouchActive){ touchBoost = false; lastTapEnd = performance.now(); playTouchActive = false; }
    });
    window.addEventListener('touchcancel', function(){
      if (playTouchActive){ touchBoost = false; lastTapEnd = performance.now(); playTouchActive = false; doubleTapArmed = false; }
    });
    window.addEventListener('keydown', function(e){
      keys[e.key] = true;
      if (e.code === 'Space') { keyBoost = true; e.preventDefault(); }
      if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','w','a','s','d'].includes(e.key)) e.preventDefault();
    });
    window.addEventListener('keyup', function(e){
      keys[e.key] = false;
      if (e.code === 'Space') keyBoost = false;
    });
    window.addEventListener('contextmenu', function(e){ if (state === 'play') e.preventDefault(); });
    window.addEventListener('blur', function(){ touchBoost = mouseBoost = keyBoost = false; playTouchActive = playMouseDown = false; doubleTapArmed = false; keys = {}; });

    on('prevSkin','click', function(){ changeSkin(-1); });
    on('nextSkin','click', function(){ changeSkin(1); });
    on('startBtn','click', startGame);
    on('againBtn','click', startGame);
    on('menuBtn','click', toMenu);
    on('nick','keydown', function(e){ if (e.key === 'Enter') startGame(); });

    var dbtns = document.querySelectorAll('#diff button');
    for (var i = 0; i < dbtns.length; i++){
      (function(btn){
        btn.addEventListener('click', function(){ difficulty = btn.getAttribute('data-d'); refreshDiffUI(); saveSettings(); });
      })(dbtns[i]);
    }

    on('muteBtn','click', toggleMute);
    on('muteBtn2','click', toggleMute);
    on('vol','input', function(){
      SND.ensure(); SND.startMusic();
      SND.setVolume(clamp(parseInt(el.vol.value, 10) / 100, 0, 1));
      if (SND.muted){ SND.setMuted(false); }
      refreshSoundUI(); saveSettings();
    });

    on('designBtn','click', function(){
      chosenSkin = CUSTOM_SKIN_IDX;
      refreshSkinUI();
    });

    on('modeSingle', 'click', function() {
        gameMode = 'single';
        el.modeSingle.classList.add('on');
        el.modeMulti.classList.remove('on');
        document.getElementById('singleOptions').style.display = 'block';
    });

    on('modeMulti', 'click', function() {
        gameMode = 'multi';
        el.modeMulti.classList.add('on');
        el.modeSingle.classList.remove('on');
        document.getElementById('singleOptions').style.display = 'none';
    });

    on('addColorBtn','click', function(){
      var cols = SKINS[CUSTOM_SKIN_IDX].colors;
      if (cols.length >= 8) return;
      cols.push('#ffffff');
      saveSettings();
      renderCustomColors();
      refreshSkinUI();
    });

    buildDots();
    refreshDiffUI();
    refreshSoundUI();
    spawnFood(FOOD_TARGET);
    for (var b = 0; b < BOT_COUNT; b++) spawnBot();
    state = 'menu';
    requestAnimationFrame(loop);
    requestAnimationFrame(drawPreview);
  }

  if (document.readyState === 'loading')
    document.addEventListener('DOMContentLoaded', boot);
  else
    boot();
})();
</script>
</body>
</html>
